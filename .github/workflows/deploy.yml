name: Fetch data, build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
    - cron: "18 */3 * * *"
    - cron: "19 */6 * * *"
    - cron: "20 */12 * * *"
    - cron: "21 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      # Restore last known good data so a failing source keeps its previous values.
      - name: Restore previous data
        uses: actions/cache/restore@v4
        with:
          path: data/*.json
          key: space-data-${{ github.run_id }}
          restore-keys: space-data-

      - name: Select scheduled sources
        id: sources
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "17 * * * *")
              echo "names=night-forecast dew-point-spread wind" >> "$GITHUB_OUTPUT"
              ;;
            "18 */3 * * *")
              echo "names=space-weather atmosphere-transparency" >> "$GITHUB_OUTPUT"
              ;;
            "19 */6 * * *")
              echo "names=launches satellites news" >> "$GITHUB_OUTPUT"
              ;;
            "20 */12 * * *")
              echo "names=moon-timeline celestial-events" >> "$GITHUB_OUTPUT"
              ;;
            "21 17 * * *")
              echo "names=visible-planets neo-close-approaches" >> "$GITHUB_OUTPUT"
              ;;
            "")
              echo "names=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Save data snapshot before fetch
        run: |
          rm -rf /tmp/space-data-before
          mkdir -p /tmp/space-data-before
          cp -a data/. /tmp/space-data-before/

      - name: Fetch data
        env:
          SOURCE_NAMES: ${{ steps.sources.outputs.names }}
          SITE_LAT: ${{ vars.SITE_LAT }}
          SITE_LON: ${{ vars.SITE_LON }}
          SITE_LOCATION_NAME: ${{ vars.SITE_LOCATION_NAME }}
          SITE_TIME_ZONE: ${{ vars.SITE_TIME_ZONE }}
        run: |
          if [ -n "$SOURCE_NAMES" ]; then
            npm run fetch -- $SOURCE_NAMES
          else
            npm run fetch
          fi

      - name: Check whether data changed
        id: changed
        run: |
          if diff -qr /tmp/space-data-before data >/dev/null; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save data
        uses: actions/cache/save@v4
        with:
          path: data/*.json
          key: space-data-${{ github.run_id }}

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_LOCATION_NAME: ${{ vars.SITE_LOCATION_NAME }}
          SITE_TIME_ZONE: ${{ vars.SITE_TIME_ZONE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
