name: Hourly weather data
run-name: "Hourly weather: ${{ github.event_name }}"

on:
  workflow_dispatch:

jobs:
  refresh:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      source_names: "night-forecast dew-point wind"
      run_label: "Hourly weather"
