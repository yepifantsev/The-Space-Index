name: Daily planets and NEOs
run-name: "Daily planets and NEOs: ${{ github.event_name }}"

on:
  schedule:
    - cron: "21 17 * * *"
  workflow_dispatch:

jobs:
  refresh:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      source_names: "visible-planets neo-close-approaches"
      run_label: "Daily planets and NEOs"
