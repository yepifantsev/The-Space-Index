name: 3-hour weather data
run-name: "3-hour weather: ${{ github.event_name }}"

on:
  schedule:
    - cron: "18 */3 * * *"
  workflow_dispatch:

jobs:
  refresh:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      source_names: "space-weather atmosphere-transparency"
      run_label: "3-hour weather"
