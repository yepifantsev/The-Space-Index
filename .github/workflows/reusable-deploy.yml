name: Reusable fetch and deploy

on:
  workflow_call:
    inputs:
      source_names:
        description: Space-separated source names, or empty to fetch all sources
        required: false
        default: ""
        type: string
      run_label:
        description: Human-readable source group label
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Restore previous data
        uses: actions/cache/restore@v4
        with:
          path: data/*.json
          key: space-data-${{ github.run_id }}
          restore-keys: space-data-

      - name: Report source group
        env:
          RUN_LABEL: ${{ inputs.run_label }}
        run: |
          echo "## Data source group: $RUN_LABEL" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch data
        env:
          SOURCE_NAMES: ${{ inputs.source_names }}
          SITE_LAT: ${{ vars.SITE_LAT }}
          SITE_LON: ${{ vars.SITE_LON }}
          SITE_LOCATION_NAME: ${{ vars.SITE_LOCATION_NAME }}
          SITE_TIME_ZONE: ${{ vars.SITE_TIME_ZONE }}
        run: |
          if [ -n "$SOURCE_NAMES" ]; then
            npm run fetch -- $SOURCE_NAMES
          else
            npm run fetch
          fi

      - name: Save data
        uses: actions/cache/save@v4
        with:
          path: data/*.json
          key: space-data-${{ github.run_id }}

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_LOCATION_NAME: ${{ vars.SITE_LOCATION_NAME }}
          SITE_TIME_ZONE: ${{ vars.SITE_TIME_ZONE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
